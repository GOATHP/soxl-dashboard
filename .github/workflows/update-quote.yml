name: Update SOXL quote

on:
  schedule:
    # 미국 장 마감 후 (평일 21:30 UTC = 한국시간 다음날 06:30)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_quote.py
      - .github/workflows/update-quote.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_quote.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/soxl.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/soxl.json
          git commit -m "Update SOXL quote"
          git push
